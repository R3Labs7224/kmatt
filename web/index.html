<script>
  // Check if localStorage is supported in the browser
  if (typeof Storage !== "undefined") {
    var itemValue = localStorage.getItem("flutter.theme");
    document.body.classList.toggle("theme-dark", itemValue === "true");
  }

</script>


<script>
  window.addEventListener('load', function(ev) {
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      serviceWorker: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
      },
      onEntrypointLoaded: function(engineInitializer) {
        let config = { renderer: 'html' };
        engineInitializer.initializeEngine(config).then(function(appRunner) {
          appRunner.runApp();

          // Wait for Flutter to render, then fade out skeleton smoothly
          setTimeout(function() {
            var loadingSkeleton = document.getElementById('flutter-loading');
            if (loadingSkeleton) {
              // Add fade-out class
              loadingSkeleton.classList.add('fade-out');

              // Remove skeleton after fade animation completes
              setTimeout(function() {
                loadingSkeleton.remove();
                document.body.classList.remove('loading-skeleton');
              }, 300); // Match CSS animation duration
            }
          }, 500); // Wait longer for Flutter to fully render

        });
      }
    });
  });
</script>
